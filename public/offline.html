<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — LB Dashboard</title>
    <style>
      * { margin: 0; box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #0a0a0f;
        color: #e8e8f0;
        height: 100vh;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 24px;
      }
      .badge {
        width: 64px; height: 64px; border-radius: 16px;
        background: #6366f1; color: #fff;
        display: grid; place-items: center;
        font-weight: 700; font-size: 22px; margin: 0 auto 20px;
      }
      h1 { font-size: 22px; margin-bottom: 8px; }
      p { color: #a1a1aa; font-size: 14px; max-width: 320px; }
      button {
        margin-top: 24px; background: #6366f1; color: #fff;
        border: 0; border-radius: 10px; padding: 12px 20px;
        font-size: 14px; font-weight: 600; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="badge">LB</div>
      <h1>Você está offline</h1>
      <p>Sem conexão com a internet. Verifique sua rede e tente novamente — seus dados estão seguros no servidor.</p>
      <button onclick="location.reload()">Tentar novamente</button>
    </div>
  </body>
</html>
